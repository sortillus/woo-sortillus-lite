name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME} (expected v1.2.3)" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Bake version for release build
        run: |
          chmod +x scripts/sync-version.sh
          ./scripts/sync-version.sh "${{ steps.version.outputs.version }}"
          header_version=$(grep -m1 -E '^\s+\*\s+Version:\s+' woo-sortillus-lite.php | sed -E 's/^\s+\*\s+Version:\s+//')
          if [[ "$header_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Failed to bake version into plugin header (got: $header_version)" >&2
            exit 1
          fi

      - name: Build plugin zip
        run: |
          chmod +x scripts/build-release.sh
          ./scripts/build-release.sh "${{ steps.version.outputs.version }}"
          unzip -p "dist/woo-sortillus-lite-${{ steps.version.outputs.version }}.zip" \
            woo-sortillus-lite/build-version.txt | grep -Fxq "${{ steps.version.outputs.version }}"
          unzip -p "dist/woo-sortillus-lite-${{ steps.version.outputs.version }}.zip" \
            woo-sortillus-lite/woo-sortillus-lite.php | grep -Fq "Version: ${{ steps.version.outputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          files: dist/woo-sortillus-lite-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
